<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸运抽奖</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  /* =========【这里改背景图】========= */
  /* 把引号里换成你的图片地址，网络图片url或者本地图片名字 */
  background: url("https://ts1.tc.mm.bing.net/th/id/R-C.07879db99076475a57fdd964387a094c?rik=bAZLhL8JVgsPVQ&riu=http%3a%2f%2fpic.qianye88.com%2fpic%2f38afd9af117441238cc6cfcf86d07e59.jpg&ehk=CIgJ84FYYZa%2bVYZqssKJzZz5TKKzjGe%2fqDy5QfRNISg%3d&risl=&pid=ImgRaw&r=0") no-repeat center center;
  background-size: cover;
  /* 如果图片太暗/太亮看不清文字，可以加一层半透明遮罩，下面这行按需打开 */
  /* background-color: rgba(0,0,0,0.3);
     background-blend-mode: multiply; */
}
.box{background:#fff;color:#333;padding:40px 60px;border-radius:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2)}
h1{margin-bottom:24px}
#name{font-size:42px;height:60px;margin:20px 0;font-weight:bold}
button{padding:14px 40px;font-size:20px;border:none;border-radius:12px;background:#ff4757;color:#fff;cursor:pointer;margin:0 8px}
button:disabled{background:#aaa;cursor:not-allowed}
.info{margin-top:16px;color:#666}
</style>
</head>
<body>
<div class="box">
  <h1>🎁 幸运抽奖</h1>
  <div id="name">等待开奖</div>
  <button id="startBtn">开始抽奖</button>
  <button id="stopBtn" disabled>停止</button>
  <div class="info">抽过的人不会重复中奖</div>
</div>

<script>
// =========在这里改参与名单==========
let list = ["小明","小红","小李","小张","小王","小赵"];
let used = [];
let timer = null;
const nameDom = document.getElementById("name");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

startBtn.onclick = ()=>{
  if(list.length === used.length){
    nameDom.innerText = "全部抽完啦";
    return;
  }
  startBtn.disabled = true;
  stopBtn.disabled = false;
  timer = setInterval(()=>{
    let temp = list[Math.floor(Math.random()*list.length)];
    nameDom.innerText = temp;
  },80)
}
stopBtn.onclick = ()=>{
  clearInterval(timer);
  stopBtn.disabled = true;
  startBtn.disabled = false;
  let winner;
  do{
    winner = list[Math.floor(Math.random()*list.length)]
  }while(used.includes(winner))
  used.push(winner);
  nameDom.innerText = "🎉 "+winner;
}
</script>
</body>
</html>
